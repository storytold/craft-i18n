[package]
name = "craft-i18n-tests"
description = "Checks on the translation catalogs themselves: rows are well formed, placeholders and plural forms match the English source text, locale and file names follow the layout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
intl_pluralrules = "=7.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spdx = "0.13.6"
tar = "0.4.46"
toml = "1.1.8"
unic-langid = "0.9"
ureq = "3.5.0"
zstd = "0.14.3"

[lints]
workspace = true

[dev-dependencies]
# Pinned at the top of the craft-libs #482-#490 stack (#485, restacked); the rev stays valid once those merge with merge commits.
craft-proof = { git = "https://github.com/storytold/craft-libs", rev = "bdd434bc" }
